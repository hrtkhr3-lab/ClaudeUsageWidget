name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build exe
        run: python -m PyInstaller --onefile --noconsole --name ClaudeUsageWidget claude_usage_widget.pyw

      - name: Package
        shell: pwsh
        run: |
          $pkg = "ClaudeUsageWidget"
          New-Item -ItemType Directory $pkg | Out-Null
          Copy-Item dist/ClaudeUsageWidget.exe, install_startup.ps1, uninstall_startup.ps1, README.md $pkg
          Compress-Archive -Path $pkg -DestinationPath "ClaudeUsageWidget-${{ github.ref_name }}-win64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ClaudeUsageWidget
          path: ClaudeUsageWidget-*.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" ClaudeUsageWidget-*.zip dist/ClaudeUsageWidget.exe --title "${{ github.ref_name }}" --generate-notes
